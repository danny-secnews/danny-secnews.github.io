name: 오늘의 보안이슈 발행

on:
  schedule:
    - cron: "40 23 * * *"   # 매일 08:40 KST
  workflow_dispatch:
    inputs:
      allow_empty:
        description: "수집 0건이어도 페이지 생성"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: boho-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 및 페이지 생성
        run: |
          python scripts/build.py ${{ inputs.allow_empty && '--allow-empty' || '' }}
      # 포털 목록(docs/data/manifest.json) 갱신 — 실패해도 데일리 커밋·발행은 그대로 진행
      - name: 포털 목록 갱신
        id: portal
        continue-on-error: true
        run: python tools/build_manifest.py
      # 커밋·푸시 전 안전장치: docs/index.html이 포털이 아니면(구형 build.py가 덮어씀)
      # 아무것도 커밋·푸시하지 않고 여기서 실패 — 깨진 포털이 main에 올라가지 않게 한다
      - name: 포털 페이지 확인
        run: |
          if ! grep -qF 'data-page="portal"' docs/index.html; then
            echo "::error::docs/index.html이 포털이 아닙니다 - 커밋·푸시하지 않고 중단 (scripts/build.py 출력 경로 확인)"
            exit 1
          fi
      - name: 변경사항 커밋
        run: |
          git config user.name  "boho-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "publish: $(TZ=Asia/Seoul date +%Y-%m-%d) 보안이슈"
            if ! git push; then
              # 그사이 포털 목록 커밋 등이 먼저 올라간 경우: 최신을 받아 다시 푸시
              if ! git pull --rebase --autostash origin main; then
                python tools/build_manifest.py || true   # 충돌 난 목록 파일을 다시 생성
                git add docs
                GIT_EDITOR=true git rebase --continue
              fi
              git push
            fi
          fi
      # 데일리 발행이 끝난 뒤에 포털 단계 실패를 알림 (빨간불 + 실패 메일)
      - name: 포털 점검 결과
        if: steps.portal.outcome == 'failure'
        run: |
          echo "::error::포털 목록 단계 실패 - '포털 목록 갱신' 로그 확인 (데일리는 이미 발행됨)"
          exit 1
