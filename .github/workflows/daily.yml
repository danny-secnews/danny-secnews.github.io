name: 오늘의 보안이슈 발행

on:
  schedule:
    - cron: "40 23 * * *"   # 매일 08:40 KST
  workflow_dispatch:
    inputs:
      allow_empty:
        description: "수집 0건이어도 페이지 생성"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: boho-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 및 페이지 생성
        run: |
          python scripts/build.py ${{ inputs.allow_empty && '--allow-empty' || '' }}
      - name: 변경사항 커밋
        run: |
          git config user.name  "boho-daily-bot"
          git config user.email "41898282+github-actions[bot]@MailScanner has detected a possible fraud attempt from "www.google.com" claiming to be users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "publish: $(TZ=Asia/Seoul date +%Y-%m-%d) 보안이슈"
            git push
          fi
