# 포털 목록(docs/data/manifest.json) 자동 갱신
# - KISA 주간·법령 분석 HTML을 올리면(push) 목록을 다시 만들고,
#   새 페이지에 공통 상단 바 한 줄이 빠져 있으면 넣어서 커밋한다.
# - 데일리 워크플로가 GITHUB_TOKEN으로 커밋한 것은 이 워크플로를 깨우지 않는다.
#   그래서 데일리 워크플로에도 build.py 다음에 build_manifest.py 단계가 있다.
# - 이 워크플로가 만드는 변경은 전부 다시 만들 수 있는 산출물이라, 푸시가 밀리면
#   최신 상태를 받아 처음부터 다시 만든다(데일리 커밋과 부딪혀도 안전).
name: portal-manifest

on:
  push:
    branches: [main]
    paths:
      - "docs/daily/**"
      - "docs/kisa-cert/**"
      - "docs/law/**"
      - "tools/build_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 목록·상단 바 갱신 후 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 tools/build_manifest.py
            git add docs
            if git diff --cached --quiet; then
              echo "변경 없음"
              exit 0
            fi
            git commit -q -m "portal: 목록 갱신"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "푸시가 밀림 - 최신 상태에서 다시 생성 ($attempt/3)"
            sleep 5
          done
          exit 1
